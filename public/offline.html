<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RunAdda — Offline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #1e293b, #7c3aed, #6366f1);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
      padding: 2rem;
    }
    .card {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 1.5rem;
      padding: 3rem 2rem;
      max-width: 400px;
    }
    h1 { font-size: 2.5rem; font-weight: 900; margin-bottom: 0.5rem; }
    h1 span { color: #facc15; }
    p { color: rgba(255,255,255,0.7); margin: 1rem 0; line-height: 1.6; }
    button {
      background: #facc15;
      color: #1e293b;
      border: none;
      padding: 0.75rem 2rem;
      border-radius: 9999px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div style="font-size:4rem;margin-bottom:1rem">🏃</div>
    <h1>Run<span>adda</span></h1>
    <p><strong>You're offline</strong></p>
    <p>Check your internet connection and try again. Your cached pages are still available.</p>
    <button onclick="window.location.reload()">Try Again</button>
  </div>
</body>
</html>
